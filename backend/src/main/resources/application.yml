spring:
  application:
    name: storeops-backend

  config:
    import:
      - optional:file:.env[.properties]
  #      - optional:file:backend/.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/storeops}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:storeops}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:storeops}
    default-schema: ${DB_SCHEMA:storeops}
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:mysecretkey}
  expiration: 3600000 # 1 hour in milliseconds
  refresh-expiration: 604800000 # 7 day in milliseconds